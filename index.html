<style>
  :root {

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);

    touch-action: pan-y; overscroll-behavior-x: none; }
  body { min-height: 100vh; }
  header { padding: 22px 28px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .brand { font-family: Syne, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .brand b { color: var(--gold); letter-spacing: 0.08em; }
  .meta { color: var(--muted); font-size: 12px; font-family: "IBM Plex Mono", monospace; }
  .wrap { padding: 8px 28px 40px; max-width: 1220px; margin: 0 auto; }
  .score { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin: 10px 0 6px; }
  .big { font-family: Syne, sans-serif; font-weight: 800; font-size: clamp(52px, 9vw, 92px); letter-spacing: -0.04em; line-height: 0.9; font-variant-numeric: tabular-nums; }
  .subscore { text-align: right; color: var(--muted); font-size: 13px; }
  .subscore .d { font-family: "IBM Plex Mono", monospace; font-size: 22px; color: var(--txt); margin-bottom: 4px; }
  .up { color: var(--green); } .dn { color: var(--red); }
  .chart-box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 8px 8px 4px; position: relative; touch-action: none; }
  .chart-stage { position: relative; }
  svg.race { width: 100%; height: auto; display: block; pointer-events: none; }
  .chart-hit { position: absolute; inset: 0; touch-action: none; cursor: crosshair; z-index: 2; }
  .tip { position: absolute; pointer-events: none; background: #1a1d26; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; display: none; z-index: 5; font-family: "IBM Plex Mono", monospace; }
  .mini { width: 100%; height: 148px; display: block; margin: 12px 0 2px; background: #12141a; border: 1px solid var(--line); border-radius: 12px; }
  .fiche-k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-family: Syne, sans-serif; }
  .rails { display: grid; gap: 8px; margin: 16px 0 6px; }
  .rail { display: grid; grid-template-columns: 44px 1fr 78px; align-items: center; gap: 10px; cursor: pointer; }
  .rail .tag { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: Syne, sans-serif; font-weight: 800; font-size: 12px; color: #0a0b0e; }
  .track { height: 10px; background: #1b1e27; border-radius: 99px; position: relative; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; width: 0; transition: width .6s ease; }
  .pawn { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #0a0b0e; transform: translate(-50%, -50%); transition: left .6s ease; }
  .rail .usd { font-family: "IBM Plex Mono", monospace; font-size: 14px; text-align: right; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
  .card:hover { border-color: #3a4152; }
  .card .nm { font-size: 13px; color: var(--muted); }
  .card .eqs { font-family: "IBM Plex Mono", monospace; font-size: 22px; margin: 6px 0 4px; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 99px; background: #222632; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
  .pill.long { background: #15352c; color: var(--green); }
  .pill.short { background: #3a1c1c; color: var(--red); }
  .steps { display: flex; gap: 8px; overflow-x: auto; margin: 18px 0 8px; }
  .step { flex: 1; min-width: 96px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .step.hit { border-color: #2c5a48; }
  .step .d { font-size: 11px; color: var(--muted); }
  .step .v { font-family: "IBM Plex Mono", monospace; font-size: 16px; margin-top: 2px; }
  #panel { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  #panel.open { display: flex; }
  .sheet { background: #181b23; border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: min(720px, 100%); max-height: 86vh; overflow: auto; padding: 22px 24px 36px; }
  .sheet h3 { margin: 0 0 4px; font-family: Syne, sans-serif; font-size: 26px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  td, th { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  td:last-child, th:last-child { text-align: right; color: var(--txt); font-family: "IBM Plex Mono", monospace; }
  .story { margin: 12px 0 0; padding: 0; list-style: none; }
  .story li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .story li em { color: var(--muted); font-style: normal; font-size: 12px; display: block; font-family: "IBM Plex Mono", monospace; }
  button.close { background: none; border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 12px; cursor: pointer; float: right; }

  .zoombar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 2px; flex-wrap: wrap; }
  .zoombar button { background: #1b1e27; border: 1px solid var(--line); color: var(--txt); border-radius: 8px; height: 28px; padding: 0 10px; cursor: pointer; font-family: "IBM Plex Mono", monospace; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .zoombar button.sq { width: 32px; padding: 0; }
  .zoombar button.on { border-color: var(--gold); color: var(--gold); }
  .zoombar button:hover { border-color: #4a5160; }
  .zoombar .hint { color: var(--muted); font-size: 11px; font-family: "IBM Plex Mono", monospace; margin-left: 6px; }
  .zoombar .zlab { margin-left: auto; color: var(--gold); font-size: 12px; font-family: "IBM Plex Mono", monospace; }
  svg.race { cursor: crosshair; }
  .legend { color: var(--muted); font-size: 12px; margin-top: 16px; }

  .hint-m { display: none; }
  header, .wrap {

    .subscore { text-align: left; }
    .subscore .d { font-size: 16px; }
    .chart-box { border-radius: 14px; padding: 4px 2px 2px; }
    .chart-stage, svg.race { min-height: 230px; height: 52vw; max-height: 320px; }
    svg.race { touch-action: none; }
    .mini { height: 128px; }
    .zoombar { padding: 8px 6px 6px; gap: 8px; flex-wrap: wrap; }
    .zoombar button { min-height: 44px; min-width: 52px; font-size: 15px; border-radius: 10px; }
    .zoombar button.sq { display: none; }
    .zoombar .hint { display: none; }

    .step { min-width: 84px; padding: 8px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .card { padding: 12px; min-height: 88px; }
    .card .eqs { font-size: 18px; }
    .sheet { width: 100%; padding: 16px 14px max(24px, env(safe-area-inset-bottom)); max-height: 92vh; }

    .legend { font-size: 11px; line-height: 1.4; }
    td, th { font-size: 12px; }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
    .big { font-size: clamp(36px, 12vw, 52px); }
  }

function fullRange(D) {

  const full = fullRange(D);
  let t0 = VIEW.t0 ?? full.t0;

  const a = anchor==null ? t1 : anchor;
  const next = Math.max(5*60000, Math.min(full.t1-full.t0, span*factor));
  let n0 = a - (a-t0)/span*next;

  if (n1 > full.t1) { n0 -= n1-full.t1; n1 = full.t1; }
  VIEW.t0 = Math.max(full.t0, n0);
  VIEW.t1 = Math.min(full.t1, n1);
  drawRace(D);
}
function panFrom(clientX, drag) {
  const svg = $("race");
  const rect = svg.getBoundingClientRect();
  const innerW = rect.width * (1000-56-92)/1000;
  const dt = -(clientX - drag.x) / Math.max(innerW,1) * (drag.t1-drag.t0);
  const full = fullRange(window.DATA);
  let n0 = drag.t0 + dt, n1 = drag.t1 + dt;
  if (n0 < full.t0) { n1 += full.t0-n0; n0 = full.t0; }
  if (n1 > full.t1) { n0 -= n1-full.t1; n1 = full.t1; }
  VIEW.t0 = n0; VIEW.t1 = n1;
  drawRace(window.DATA);
}

function parisTime(t) {

}
function svgXY(clientX, clientY) {
  const svg = $("race");
  const rect = svg.getBoundingClientRect();

function pinchDist(touches) {
  const a = touches[0], b = touches[1];
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}
function pinchAnchor(touches) {
  const mid = (touches[0].clientX + touches[1].clientX) / 2;
  const {sx} = svgXY(mid, 0);
  const full = fullRange(window.DATA);
  const t0 = VIEW.t0 ?? full.t0, t1 = VIEW.t1 ?? full.t1;
  const L=56, R=92, innerW=1000-L-R;
  return t0 + Math.max(0, Math.min(1, (sx-L)/innerW)) * (t1-t0);
}
function bindBtn(el, fn) {
  if (!el) return;
  el.addEventListener("click", (e) => { e.preventDefault(); fn(); });
}

function bindZoom(D) {
  if (BOUND) return;
  const hit = $("charthit");
  const box = $("chartbox");
  if (!hit || !box) return;
  BOUND = true;
  box.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const svg = $("race");
    const rect = svg.getBoundingClientRect();
    const sx = (ev.clientX - rect.left) * (1000 / Math.max(rect.width,1));
    const L=56, R=92, innerW=1000-L-R;
    const full = fullRange(window.DATA);
    const t0 = VIEW.t0 ?? full.t0, t1 = VIEW.t1 ?? full.t1;
    const anchor = t0 + Math.max(0, Math.min(1, (sx-L)/innerW)) * (t1-t0);
    applyZoom(ev.deltaY>0 ? 1.22 : 0.78, anchor, window.DATA);
  }, {passive:false});

  // iOS Safari: native gesture events actually fire for pinch.
  box.addEventListener("gesturestart", (ev) => {
    ev.preventDefault();
    const full = fullRange(window.DATA);
    GEST = {mode:"gesture", t0: VIEW.t0 ?? full.t0, t1: VIEW.t1 ?? full.t1};
  }, {passive:false});
  box.addEventListener("gesturechange", (ev) => {
    ev.preventDefault();
    if (!GEST || GEST.mode !== "gesture") return;
    VIEW.t0 = GEST.t0; VIEW.t1 = GEST.t1;
    applyZoom(1 / Math.max(ev.scale, 0.05), null, window.DATA);
  }, {passive:false});
  box.addEventListener("gestureend", () => { if (GEST && GEST.mode === "gesture") GEST = null; }, {passive:false});

  // Touch pinch (Android / iOS fallback). Overlay is never rebuilt so the gesture survives drawRace.
  hit.addEventListener("touchstart", (ev) => {
    if (ev.touches.length >= 2) {
      ev.preventDefault();
      const full = fullRange(window.DATA);
      GEST = {mode:"pinch", d: Math.max(pinchDist(ev.touches), 1), t0: VIEW.t0 ?? full.t0, t1: VIEW.t1 ?? full.t1, anchor: pinchAnchor(ev.touches)};
    } else if (ev.touches.length === 1) {
      const full = fullRange(window.DATA);
      GEST = {mode:"maybe", x: ev.touches[0].clientX, y: ev.touches[0].clientY, t0: VIEW.t0 ?? full.t0, t1: VIEW.t1 ?? full.t1};
    }
  }, {passive:false});
  hit.addEventListener("touchmove", (ev) => {
    if (GEST && GEST.mode === "pinch" && ev.touches.length >= 2) {
      ev.preventDefault();
      const d = pinchDist(ev.touches);
      VIEW.t0 = GEST.t0; VIEW.t1 = GEST.t1;
      applyZoom(GEST.d / Math.max(d, 1), GEST.anchor, window.DATA);
      return;
    }
    if (GEST && GEST.mode !== "pinch" && GEST.mode !== "gesture" && ev.touches.length === 1) {
      const dist = Math.hypot(ev.touches[0].clientX - GEST.x, ev.touches[0].clientY - GEST.y);
      if (dist > 10) GEST.mode = "pan";
      if (GEST.mode === "pan") {
        ev.preventDefault();
        panFrom(ev.touches[0].clientX, GEST);
        $("tip").style.display = "none";
      }
    }
  }, {passive:false});
  hit.addEventListener("touchend", (ev) => {
    if (GEST && GEST.mode === "maybe" && ev.changedTouches.length) {
      const tch = ev.changedTouches[0];
      const moved = Math.hypot(tch.clientX - GEST.x, tch.clientY - GEST.y);
      if (moved < 12 && ev.touches.length === 0) {
        const now = Date.now();
        if (now - LAST_TAP < 300) {
          applyZoom(0.62, pinchAnchor([{clientX:tch.clientX, clientY:tch.clientY},{clientX:tch.clientX, clientY:tch.clientY}]), window.DATA);
          LAST_TAP = 0;
        } else {
          LAST_TAP = now;
          const h = hitFill(tch.clientX, tch.clientY);
          if (h) openFill(h);
        }
      }
    }
    if (ev.touches.length === 0) GEST = null;
    else if (ev.touches.length === 1) {
      const full = fullRange(window.DATA);
      GEST = {mode:"pan", x: ev.touches[0].clientX, t0: VIEW.t0 ?? full.t0, t1: VIEW.t1 ?? full.t1};
    }
  }, {passive:false});

  hit.addEventListener("pointerdown", (ev) => {
    if (ev.pointerType !== "mouse") return;
    hit.setPointerCapture(ev.pointerId);
    PTRS.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
    const full = fullRange(window.DATA);
    GEST = {mode:"maybe", x: ev.clientX, y: ev.clientY, t0: VIEW.t0 ?? full.t0, t1: VIEW.t1 ?? full.t1};
  });
  hit.addEventListener("pointermove", (ev) => {
    if (ev.pointerType !== "mouse") return;
    if (GEST && GEST.mode !== "pinch" && GEST.mode !== "gesture") {
      const dist = Math.hypot(ev.clientX - GEST.x, ev.clientY - GEST.y);
      if (dist > 8) GEST.mode = "pan";
      if (GEST.mode === "pan") {
        panFrom(ev.clientX, GEST);
        $("tip").style.display = "none";
        return;
      }
    }
    showTipAt(ev.clientX, ev.clientY);
  });
  hit.addEventListener("pointerup", (ev) => {
    if (ev.pointerType !== "mouse") return;
    PTRS.delete(ev.pointerId);
    if (GEST && GEST.mode === "maybe") {
      const h = hitFill(ev.clientX, ev.clientY);
      if (h) openFill(h);
    }
    GEST = null;
  });
  hit.addEventListener("pointerleave", () => { $("tip").style.display = "none"; });

  bindBtn($("zin"), () => applyZoom(0.6, null, window.DATA));
  bindBtn($("zout"), () => applyZoom(1.7, null, window.DATA));
  bindBtn($("zreset"), () => { VIEW.t0 = VIEW.t1 = null; drawRace(window.DATA); });
  document.querySelectorAll(".zoombar [data-win]").forEach(b => {
    bindBtn(b, () => setWindowHours(Number(b.dataset.win)));
  });
}

function drawRace(D) {
  const svg = $("race");
  const W=1000, H=420, L=56, R=92, T=22, B=36;
  const innerW = W-L-R, innerH = H-T-B;
  const racers = racersOf(D);
  const ghost = D.ghost || [];
  const all = [];
  racers.forEach(r => (r.hist||[]).forEach(p => all.push(p)));
  if (!all.length) { svg.innerHTML = ""; return; }
  const full = fullRange(D);
  const tmin = VIEW.t0 ?? full.t0;
  const tmax = VIEW.t1 ?? full.t1;
  let eqs = all.filter(p => { const t=parseT(p.t); return t>=tmin && t<=tmax; }).map(p => p.eq);
  if (!eqs.length) {
    if (VIEW.t0 != null) { VIEW.t0 = VIEW.t1 = null; return drawRace(D); }
    eqs = all.map(p => p.eq);
  }
  const eqs2 = eqs;
  let ymin = Math.min(...eqs2) - 3;
  let ymax = Math.max(...eqs2) + 3;
  if (ymax - ymin < 8) { const mid=(ymin+ymax)/2; ymin=mid-4; ymax=mid+4; }
  if (50 >= ymin-1 && 50 <= ymax+1) { ymin = Math.min(ymin, 48); ymax = Math.max(ymax, 52); }
  const x = (t) => L + ((t-tmin)/Math.max(tmax-tmin,1)) * innerW;
  const y = (eq) => T + (1 - (eq-ymin)/(ymax-ymin)) * innerH;
  const gridY = [];
  [50, 67, 100, 200].forEach(m => { if (m>=ymin && m<=ymax) gridY.push(m); });
  for (let v = Math.ceil(ymin/10)*10; v<=ymax; v+=10) {
    if (!gridY.includes(v) && v!==50) gridY.push(v);
  }
  let g = "";
  gridY.forEach(m => {
    const yy = y(m);
    g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#242833" stroke-dasharray="${m===50||m===100?"0":"3 6"}"/>`;
    g += `<text x="${W-R+8}" y="${yy+4}" fill="#8b90a0" font-size="11" font-family="IBM Plex Mono">${m}$</text>`;
  });
  const span = tmax-tmin;
  const narrow = (typeof window !== "undefined") && window.innerWidth < 640;
  const ticks = narrow ? 3 : 5;
  for (let i=0;i<=ticks;i++){
    const tt = tmin + span*i/ticks;
    const xx = x(tt);
    const lab = new Date(tt).toLocaleString("fr-FR", narrow
      ? {timeZone:"Europe/Paris", day:"2-digit", month:"short", hour:"2-digit"}
      : {timeZone:"Europe/Paris", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
    g += `<text x="${xx}" y="${H-10}" fill="#8b90a0" font-size="${narrow?9:10}" font-family="IBM Plex Mono" text-anchor="middle">${lab}</text>`;
  }
  function pathOf(series) {
    const pts = (series||[]).filter(p => {
      const t = parseT(p.t);
      return t >= tmin-1 && t <= tmax+1;
    }).map(p => [x(parseT(p.t)), y(Math.max(ymin, Math.min(ymax, p.eq)))]);
    if (pts.length===0) return "";
    if (pts.length===1) return `M${pts[0][0]},${pts[0][1]}`;
    return pts.map((p,i)=> (i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  }
  if (ghost.length) {
    const gp = pathOf(ghost);
    if (gp) g += `<path d="${gp}" fill="none" stroke="#3a4154" stroke-width="1.5" stroke-dasharray="5 7"/>`;
  }
  const marks = [];
  racers.forEach(r => {
    const d = pathOf(r.hist||[]);
    if (d) g += `<path d="${d}" fill="none" stroke="${r.color}" stroke-width="${r.id==="temoin"?3.2:2.2}" stroke-linecap="round" stroke-linejoin="round" opacity="${r.id==="temoin"?1:0.92}"/>`;
    (r.fills||[]).forEach(f => {
      const tt = parseT(f.t);
      if (!tt || tt<tmin || tt>tmax) return;
      let eq = f.eq;
      if (eq==null) {
        const h = r.hist||[];
        let best=null, bd=1e18;
        h.forEach(p => { const d=Math.abs(parseT(p.t)-tt); if (d<bd){bd=d;best=p;} });
        eq = best ? best.eq : 50;
      }
      const px = x(tt), py = y(eq);
      const col = r.color;
      if (f.kind === "open") {
        const dir = f.side === "short" ? 1 : -1;
        g += `<polygon points="${px},${py+dir*7} ${px-6.5},${py-dir*6} ${px+6.5},${py-dir*6}" fill="${col}" stroke="#0a0b0e" stroke-width="1.2"/>`;
      } else {
        g += `<rect x="${px-5}" y="${py-5}" width="10" height="10" fill="#0a0b0e" stroke="${col}" stroke-width="2"/>`;
      }
      marks.push({px, py, r, f, eq});
    });
    const last = (r.hist||[])[(r.hist||[]).length-1];
    if (!last) return;
    const lt = parseT(last.t);
    if (lt<tmin || lt>tmax) return;
    const px = x(lt), py = y(last.eq);
    g += `<circle cx="${px}" cy="${py}" r="9" fill="${r.color}" stroke="#0a0b0e" stroke-width="2"/>`;
    g += `<text x="${px}" y="${py+3.5}" text-anchor="middle" font-size="8" font-family="Syne,sans-serif" font-weight="800" fill="#0a0b0e">${r.tag||""}</text>`;
  });
  svg.innerHTML = g;
  window._marks = marks;
  updateZoomLabel();
}

function miniChart(b) {
  const hist = b.hist || [];
  if (hist.length < 2) return `<p class="meta">Pas encore assez de points pour la courbe.</p>`;
  const W=640, H=160, L=40, R=14, T=10, B=22;
  const ts = hist.map(p => parseT(p.t));
  const t0 = Math.min(...ts), t1 = Math.max(...ts);
  const eqs = hist.map(p => p.eq);
  let ymin = Math.min(...eqs) - 2, ymax = Math.max(...eqs) + 2;
  if (ymax - ymin < 8) ymax = ymin + 8;
  const x = (t) => L + ((t-t0)/Math.max(t1-t0,1)) * (W-L-R);
  const y = (eq) => T + (1 - (eq-ymin)/(ymax-ymin)) * (H-T-B);
  const d = hist.map((p,i) => (i?"L":"M") + x(parseT(p.t)).toFixed(1) + "," + y(p.eq).toFixed(1)).join(" ");
  let g = `<line x1="${L}" x2="${W-R}" y1="${y(50)}" y2="${y(50)}" stroke="#242833" stroke-dasharray="3 5"/>`;
  g += `<path d="${d}" fill="none" stroke="${b.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  (b.fills||[]).forEach(f => {
    const tt = parseT(f.t); if (!tt) return;
    let eq = f.eq;
    if (eq==null) {
      let best=hist[0], bd=1e18;
      hist.forEach(p => { const d=Math.abs(parseT(p.t)-tt); if (d<bd){bd=d;best=p;} });
      eq = best.eq;
    }
    const px=x(tt), py=y(eq);
    if (f.kind==="open") g += `<polygon points="${px},${py-6} ${px-5},${py+4} ${px+5},${py+4}" fill="${b.color}"/>`;
    else g += `<rect x="${px-4}" y="${py-4}" width="8" height="8" fill="#181b23" stroke="${b.color}" stroke-width="2"/>`;
  });
  const last = hist[hist.length-1];
  g += `<circle cx="${x(parseT(last.t))}" cy="${y(last.eq)}" r="4.5" fill="${b.color}"/>`;
  g += `<text x="${L}" y="${H-5}" fill="#8b90a0" font-size="10" font-family="IBM Plex Mono">${parisTime(t0)} → ${parisTime(t1)}</text>`;
  g += `<text x="${W-R}" y="${T+10}" fill="#8b90a0" font-size="10" font-family="IBM Plex Mono" text-anchor="end">${fmt(ymax,0)}$</text>`;
  g += `<text x="${W-R}" y="${H-B}" fill="#8b90a0" font-size="10" font-family="IBM Plex Mono" text-anchor="end">${fmt(ymin,0)}$</text>`;
  return `<svg class="mini" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}

function openFill(hit) {
  if (!hit) return;
  const f = hit.f, r = hit.r;
  const lab = f.kind === "open" ? "Prise de position" : "Sortie";
  const sym = (f.symbol||"").replace("PF_","").replace("USD","");
  const pr = f.price;
  $("sheet").innerHTML = `<button class="close" onclick="document.getElementById('panel').classList.remove('open')">fermer</button>
    <div class="fiche-k" style="color:${r.color}">${r.name}</div>
    <h3>${lab}</h3>
    <p class="meta">${parisTime(f.t)}</p>
    <p>${posLine({side:f.side, symbol:f.symbol})} ${sym}</p>
    <table>
      <tr><th>Prix</th><td>${pr!=null?fmt(pr, pr<1?5:4):"—"}</td></tr>
      <tr><th>Solde à cet instant</th><td>${usd(hit.eq)}</td></tr>
      ${f.reason?`<tr><th>Pourquoi</th><td>${f.reason}</td></tr>`:""}
      ${f.size!=null?`<tr><th>Taille</th><td>${fmt(f.size, f.size>10?0:4)}</td></tr>`:""}
    </table>
    <p style="margin-top:16px"><button class="close" style="float:none" id="gotobook">courbe ${r.name}</button></p>`;
  $("panel").classList.add("open");
  const go = $("gotobook");
  if (go) go.onclick = (e) => { e.stopPropagation(); openCard(r); };
}

function openCard(b) {
  if (!b) return;
  const p = b.position;
  let body = `<button class="close" onclick="document.getElementById('panel').classList.remove('open')">fermer</button>
    <h3>${b.name}</h3>
    <p class="meta">${b.subtitle||""}</p>
    <div class="big ${cls(b.pnl)}" style="font-size:48px">${usd(b.equity)}</div>
    <p class="${cls(b.pnl)}">${pct(b.pnl_pct)} · max DD ${b.max_dd!=null?fmt(b.max_dd,1)+"%":"—"} · trades ${b.trades??"—"}</p>
    ${miniChart(b)}
    <table>
      <tr><th>Départ</th><td>${usd(b.start)}</td></tr>
      ${b.lock_trump?`<tr><th>Après lock TRUMP</th><td>${usd(b.lock_trump)}</td></tr>`:""}
      ${b.high_water?`<tr><th>Plus haut</th><td>${usd(b.high_water)}</td></tr>`:""}
      ${p?`<tr><th>Position</th><td>${p.side} ${p.symbol} × ${fmt(p.size, p.size>10?0:4)}</td></tr>
      <tr><th>Entry / mark</th><td>${fmt(p.entry, p.entry<1?5:4)} / ${fmt(p.mark, p.mark<1?5:4)}</td></tr>
      <tr><th>Stop / TP</th><td>${p.stop??"—"} / ${p.take_profit??"—"}</td></tr>`:`<tr><th>Position</th><td>flat</td></tr>`}
    </table>`;
  if (b.story) body += `<ul class="story">${b.story.map(s=>`<li><em>${s.t}</em>${s.e}</li>`).join("")}</ul>`;
  if (b.log && b.log.length) {
    body += `<table>` + b.log.slice().reverse().map(x=>`<tr><th>${(x.ts||"").replace("T"," ").slice(0,16)}</th><td>${x.action} ${x.side||""} ${(x.symbol||"").replace("PF_","")}</td></tr>`).join("") + `</table>`;
  }
  if (b.last_reason) body += `<p class="legend">${b.last_reason}</p>`;
  $("sheet").innerHTML = body;
  $("panel").classList.add("open");
}

$("panel").onclick = (e) => { if (e.target.id==="panel") $("panel").classList.remove("open"); };
$("big").onclick = () => openCard(window.DATA.temoin);

function paint(D) {
  window.DATA = D;
  if (VIEW.t0 == null && window.innerWidth < 720) {
    const full = fullRange(D);
    VIEW.t1 = full.t1;
    VIEW.t0 = Math.max(full.t0, full.t1 - 24*3600000);
  }
  renderScore(D);
  bindZoom(D);
  drawRace(D);
  renderRails(D);
  renderSteps(D.temoin.equity, D);
  renderGrid(D);
}
async function boot() {
  let D = DATA;
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if (r.ok) D = await r.json();
  } catch (e) {}
  paint(D);
}
boot();
setInterval(boot, 20000);
</script>
