<style>

  .legend { color: var(--muted); font-size: 12px; margin-top: 16px; }

function fullRange(D) {
  const racers = racersOf(D);
  const all = [];
  racers.forEach(r => (r.hist||[]).forEach(p => all.push(parseT(p.t))));
  (D.ghost||[]).forEach(p => all.push(parseT(p.t)));
  if (!all.length) return {t0: Date.now()-86400000, t1: Date.now()};
  return {t0: Math.min(...all), t1: Math.max(Date.now(), ...all)};
}
function applyZoom(factor, anchor, D) {

  const a = anchor==null ? (t0+t1)/2 : anchor;
  const next = Math.max(5*60000, Math.min(full.t1-full.t0, span*factor));
  let n0 = a - (a-t0)/span*next;
  let n1 = n0 + next;
  if (n0 < full.t0) { n1 += full.t0-n0; n0 = full.t0; }
  if (n1 > full.t1) { n0 -= n1-full.t1; n1 = full.t1; }
  VIEW.t0 = Math.max(full.t0, n0);
  VIEW.t1 = Math.min(full.t1, n1);
  drawRace(D);
}

    if (n0 < full.t0) { n1 += full.t0-n0; n0 = full.t0; }

function drawRace(D) {
  const svg = $("race");
  const W=1000, H=420, L=56, R=92, T=22, B=36;
  const innerW = W-L-R, innerH = H-T-B;
  const racers = racersOf(D);
  const ghost = D.ghost || [];
  const all = [];
  racers.forEach(r => (r.hist||[]).forEach(p => all.push(p)));
  if (!all.length) { svg.innerHTML = ""; return; }
  const full = fullRange(D);
  const tmin = VIEW.t0 ?? full.t0;
  const tmax = VIEW.t1 ?? full.t1;
  const eqs = all.filter(p => { const t=parseT(p.t); return t>=tmin && t<=tmax; }).map(p => p.eq);
  const eqs2 = eqs.length ? eqs : all.map(p => p.eq);
  let ymin = Math.min(40, ...eqs2) - 6;
  let ymax = Math.max(90, ...eqs2) * 1.12;
  if (ymax - ymin < 30) ymax = ymin + 30;
  const x = (t) => L + ((t-tmin)/Math.max(tmax-tmin,1)) * innerW;
  const y = (eq) => T + (1 - (eq-ymin)/(ymax-ymin)) * innerH;
  const gridY = [];
  [50, 67, 100, 200].forEach(m => { if (m>=ymin && m<=ymax) gridY.push(m); });
  for (let v = Math.ceil(ymin/10)*10; v<=ymax; v+=10) {
    if (!gridY.includes(v) && v!==50) gridY.push(v);
  }
  let g = "";
  gridY.forEach(m => {
    const yy = y(m);
    g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#242833" stroke-dasharray="${m===50||m===100?"0":"3 6"}"/>`;
    g += `<text x="${W-R+8}" y="${yy+4}" fill="#8b90a0" font-size="11" font-family="IBM Plex Mono">${m}$</text>`;
  });
  const span = tmax-tmin;
  const ticks = 5;
  for (let i=0;i<=ticks;i++){
    const tt = tmin + span*i/ticks;
    const xx = x(tt);
    const lab = new Date(tt).toLocaleString("fr-FR",{timeZone:"Europe/Paris", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
    g += `<text x="${xx}" y="${H-10}" fill="#8b90a0" font-size="10" font-family="IBM Plex Mono" text-anchor="middle">${lab}</text>`;
  }
  function pathOf(series, clip=true) {
    const pts = (series||[]).filter(p => {
      const t = parseT(p.t);
      return t >= tmin-1 && t <= tmax+1;
    }).map(p => [x(parseT(p.t)), y(p.eq)]);
    if (clip) {
      // keep ghost points even if eq is off-scale
    }
    if (pts.length===0) return "";
    if (pts.length===1) return `M${pts[0][0]},${pts[0][1]}`;
    return pts.map((p,i)=> (i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  }
  if (ghost.length) {
    const gp = pathOf(ghost, true);
    if (gp) g += `<path d="${gp}" fill="none" stroke="#3a4154" stroke-width="1.5" stroke-dasharray="5 7"/>`;
  }
  const marks = [];
  racers.forEach(r => {
    const d = pathOf(r.hist||[], false);
    if (d) g += `<path d="${d}" fill="none" stroke="${r.color}" stroke-width="${r.id==="temoin"?3.2:2.2}" stroke-linecap="round" stroke-linejoin="round" opacity="${r.id==="temoin"?1:0.92}"/>`;
    (r.fills||[]).forEach(f => {
      const tt = parseT(f.t);
      if (!tt || tt<tmin || tt>tmax) return;
      let eq = f.eq;
      if (eq==null) {
        const h = r.hist||[];
        let best=null, bd=1e18;
        h.forEach(p => { const d=Math.abs(parseT(p.t)-tt); if (d<bd){bd=d;best=p;} });
        eq = best ? best.eq : 50;
      }
      const px = x(tt), py = y(eq);
      const col = r.color;
      if (f.kind === "open") {
        const dir = f.side === "short" ? 1 : -1;
        g += `<polygon points="${px},${py+dir*6} ${px-5.5},${py-dir*5} ${px+5.5},${py-dir*5}" fill="${col}" stroke="#0a0b0e" stroke-width="1.2"/>`;
      } else {
        g += `<rect x="${px-4}" y="${py-4}" width="8" height="8" fill="#0a0b0e" stroke="${col}" stroke-width="2"/>`;
      }
      marks.push({px, py, r, f, eq});
    });
    const last = (r.hist||[])[(r.hist||[]).length-1];
    if (!last) return;
    const lt = parseT(last.t);
    if (lt<tmin || lt>tmax) return;

    g += `<circle cx="${px}" cy="${py}" r="9" fill="${r.color}" stroke="#0a0b0e" stroke-width="2"/>`;
    g += `<text x="${px}" y="${py+3.5}" text-anchor="middle" font-size="8" font-family="Syne,sans-serif" font-weight="800" fill="#0a0b0e">${r.tag||""}</text>`;
  });
  svg.innerHTML = g;
  window._marks = marks;
  svg.onmousemove = (ev) => {
    if (DRAG) return;
    const rect = svg.getBoundingClientRect();
    const sx = (ev.clientX - rect.left) * (W / rect.width);
    const sy = (ev.clientY - rect.top) * (H / rect.height);
    const tip = $("tip");

    (window._marks||[]).forEach(m => {

    tip.style.display = "block";
    tip.style.left = Math.min(ev.offsetX+12, rect.width-220) + "px";

    if (hit) {
      const f = hit.f;
      const sym = (f.symbol||"").replace("PF_","").replace("USD","");
      const lab = f.kind==="open" ? "achat" : "vente";
      tip.innerHTML = `<div><span style="color:${hit.r.color}">●</span> ${hit.r.name}</div><div>${lab} ${f.side||""} ${sym}</div><div>${f.price!=null?fmt(f.price, f.price<1?5:4):"—"} · ${fmt(hit.eq,2)}$</div>`;

    const rows = racers.map(r => {
      const h = r.hist||[];
      if (!h.length) return null;

      h.forEach(p => { const d=Math.abs(parseT(p.t)-t); if (d<bd){bd=d;best=p;} });

    tip.innerHTML = rows.map(r => `<div><span style="color:${r.color}">●</span> ${r.name} ${fmt(r.eq,2)}$</div>`).join("");

    <h3>${b.name}</h3>
    <p class="meta">${b.subtitle||""}</p>
    <div class="big ${cls(b.pnl)}" style="font-size:48px">${usd(b.equity)}</div>
    <p class="${cls(b.pnl)}">${pct(b.pnl_pct)} · max DD ${b.max_dd!=null?fmt(b.max_dd,1)+"%":"—"} · trades ${b.trades??"—"}</p>
    <table>
      <tr><th>Départ</th><td>${usd(b.start)}</td></tr>
      ${b.lock_trump?`<tr><th>Après lock TRUMP</th><td>${usd(b.lock_trump)}</td></tr>`:""}
      ${b.high_water?`<tr><th>Plus haut</th><td>${usd(b.high_water)}</td></tr>`:""}
      ${p?`<tr><th>Position</th><td>${p.side} ${p.symbol} × ${fmt(p.size, p.size>10?0:4)}</td></tr>
      <tr><th>Entry / mark</th><td>${fmt(p.entry, p.entry<1?5:4)} / ${fmt(p.mark, p.mark<1?5:4)}</td></tr>
      <tr><th>Stop / TP</th><td>${p.stop??"—"} / ${p.take_profit??"—"}</td></tr>`:`<tr><th>Position</th><td>flat</td></tr>`}
    </table>`;
  if (b.story) body += `<ul class="story">${b.story.map(s=>`<li><em>${s.t}</em>${s.e}</li>`).join("")}</ul>`;
  if (b.log && b.log.length) {
    body += `<table>` + b.log.slice().reverse().map(x=>`<tr><th>${(x.ts||"").replace("T"," ").slice(0,16)}</th><td>${x.action} ${x.side||""} ${(x.symbol||"").replace("PF_","")}</td></tr>`).join("") + `</table>`;
  }
  if (b.last_reason) body += `<p class="legend">${b.last_reason}</p>`;
  $("sheet").innerHTML = body;
  $("panel").classList.add("open");
}
$("panel").onclick = (e) => { if (e.target.id==="panel") $("panel").classList.remove("open"); };
$("big").onclick = () => openCard(window.DATA.temoin);

function paint(D) {
  window.DATA = D;
  renderScore(D);
  bindZoom(D);
  drawRace(D);
  renderRails(D);
  renderSteps(D.temoin.equity, D);
  renderGrid(D);
}
async function boot() {
  let D = DATA;
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if (r.ok) D = await r.json();
  } catch (e) {}
  paint(D);
}
boot();
setInterval(boot, 20000);
</script>
</body>
</html>
