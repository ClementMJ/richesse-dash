<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Richesse — 50 → 1000</title>
<style>
  :root {
    --bg: #0c0d10; --card: #16181e; --card2: #1d2028; --line: #2a2e38;
    --txt: #ece7dc; --muted: #9a9284; --gold: #d4b56a; --green: #6fbf8a;
    --red: #d36b6b; --blue: #7aa2d4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.45 "Iowan Old Style", Palatino, Georgia, serif; }
  body { min-height: 100vh; }
  header { padding: 28px 28px 8px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 28px; font-weight: 500; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--gold); }
  .meta { color: var(--muted); font-size: 13px; }
  .wrap { padding: 12px 28px 48px; max-width: 1180px; }
  .hero { background: linear-gradient(160deg, #1c1a14 0%, #16181e 60%); border: 1px solid #3a3424; border-radius: 18px; padding: 22px 24px; cursor: pointer; }
  .hero:hover { border-color: var(--gold); }
  .kicker { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .eq { font-size: 42px; font-variant-numeric: tabular-nums; margin: 4px 0; }
  .up { color: var(--green); } .dn { color: var(--red); }
  .row { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; min-height: 132px; }
  .card:hover { border-color: #4a5160; transform: translateY(-1px); }
  .card.flat { opacity: 0.78; }
  .card .nm { font-size: 15px; margin-bottom: 2px; }
  .card .sub { color: var(--muted); font-size: 12px; min-height: 32px; }
  .card .eqs { font-size: 26px; font-variant-numeric: tabular-nums; margin-top: 8px; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #2a2e38; color: var(--muted); }
  .pill.long { background: #1c3326; color: var(--green); }
  .pill.short { background: #3a1e1e; color: var(--red); }
  .track { margin: 28px 0 8px; }
  .track h2 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 0 0 10px; }
  .steps { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .step { flex: 1; min-width: 110px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .step.hit { border-color: #3d5a45; }
  .step.miss { border-color: #5a3333; }
  .step .d { font-size: 11px; color: var(--muted); }
  .step .v { font-size: 18px; margin-top: 4px; }
  #panel { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  #panel.open { display: flex; }
  .sheet { background: var(--card2); border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: min(720px, 100%); max-height: 86vh; overflow: auto; padding: 22px 24px 36px; }
  .sheet h3 { margin: 0 0 4px; font-size: 22px; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  td, th { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  td:last-child, th:last-child { text-align: right; color: var(--txt); font-variant-numeric: tabular-nums; }
  .story { margin: 12px 0 0; padding: 0; list-style: none; }
  .story li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .story li em { color: var(--muted); font-style: normal; font-size: 12px; display: block; }
  button.close { background: none; border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 12px; cursor: pointer; float: right; }
  .legend { color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Richesse <span>50 → 1000</span></h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="meta">Paper only · 10x max · 0$ réel · deadline 22 sept</div>
</header>
<div class="wrap">
  <div class="hero" id="hero"></div>
  <div class="track">
    <h2>Temps de passage (témoin, depuis 50$)</h2>
    <div class="steps" id="steps"></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="legend">Clique une carte pour le détail. Témoin = vrai compte paper Kraken. Les 5 livres = stratégies isolées à 50$, prix live, frais 0.26%, pas de slippage. MAJ toutes les 30 min.</p>
</div>
<div id="panel"><div class="sheet" id="sheet"></div></div>
<script>
const DATA = {"generated_at": "2026-08-23T23:31:22.060683+02:00", "deadline": "2026-09-22T23:59:59+02:00", "ticks": 1, "temoin": {"id": "temoin", "name": "T\u00e9moin", "subtitle": "Vrai paper Kraken \u2014 PUMP 10x", "kind": "temoin", "equity": 74.03550952637836, "start": 50.0, "pnl": 24.035509526378362, "pnl_pct": 48.071019052756725, "collateral": 72.74724639637842, "high_water": 83.16, "lock_trump": 72.94, "position": {"symbol": "PF_PUMPUSD", "side": "long", "size": 77000.0, "entry": 0.00523, "mark": 0.00524673069, "leverage": 10.0, "liq": 0.0048116, "u_pnl": 1.2882631299999514, "stop": 0.00488, "take_profit": 0.00564}, "status": "active", "story": [{"t": "22 ao\u00fbt 17:25", "e": "Long TRUMP 190 @ 2.364, stack 50$"}, {"t": "22 ao\u00fbt soir", "e": "Pic ~90$ puis dump ~28$"}, {"t": "23 ao\u00fbt 09:40", "e": "Lock TRUMP @ 2.487 \u2192 +23$, stack 73$"}, {"t": "23 ao\u00fbt 09:41", "e": "Long PUMP 77k @ 0.00523"}, {"t": "23 ao\u00fbt 15:34", "e": "Pic session ~83$"}, {"t": "maintenant", "e": "Stack 74.04$ \u2014 PUMP MTM ~+1.1$ vs lock TRUMP"}], "orders": ["TP 0.00564", "SL 0.00488"]}, "livres": [{"id": "wick_fade", "name": "Wick fade", "subtitle": "Fade la m\u00e8che de liq, stop derri\u00e8re", "kind": "livre", "equity": 50.0, "start": 50.0, "pnl": 0.0, "pnl_pct": 0.0, "high_water": 50.0, "max_dd": 0.0, "trades": 0, "fees": 0, "status": "active", "last_reason": "", "time_to_100": null, "position": null, "log": []}, {"id": "antimart_residual", "name": "Anti-martingale", "subtitle": "Residual gated, 40\u219270% apr\u00e8s les wins", "kind": "livre", "equity": 49.48, "start": 50.0, "pnl": -0.5200000000000031, "pnl_pct": -1.0400000000000076, "high_water": 50.0, "max_dd": 1.04, "trades": 0, "fees": 0.52, "status": "active", "last_reason": "residual PF_WLDUSD r=6.0 btc=1.1 frac=0.40", "time_to_100": null, "position": {"symbol": "PF_WLDUSD", "side": "long", "size": 480.34755302798504, "entry": 0.41636518962, "mark": 0.41636518962, "leverage": 10, "stop": 0.3944601792256735, "take_profit": null, "margin": 20.0, "notional": 200.0}, "log": [{"ts": "2026-08-23T21:19:01Z", "action": "open", "symbol": "PF_WLDUSD", "side": "long", "size": 480.34755302798504, "price": 0.41636518962, "notional": 200.0, "fee": 0.52, "pnl": 0.0, "reason": "residual PF_WLDUSD r=6.0 btc=1.1 frac=0.40", "equity_after": 49.480000000000004, "stop": 0.3944601792256735, "take_profit": null, "margin": 20.0}]}, {"id": "basis_squeeze", "name": "Basis squeeze", "subtitle": "Ride le funding crowded, pas fade", "kind": "livre", "equity": 49.285, "start": 50.0, "pnl": -0.7150000000000034, "pnl_pct": -1.430000000000009, "high_water": 50.0, "max_dd": 1.43, "trades": 0, "fees": 0.7150000000000001, "status": "active", "last_reason": "squeeze_ride PF_XBTUSD fr=2.0881386504673074 chg=1.05", "time_to_100": null, "position": {"symbol": "PF_XBTUSD", "side": "long", "size": 0.003525840471367504, "entry": 77995.5877848724, "mark": 77995.5877848724, "leverage": 10, "stop": 76945.62853843445, "take_profit": null, "margin": 27.500000000000004, "notional": 275.00000000000006}, "log": [{"ts": "2026-08-23T21:19:01Z", "action": "open", "symbol": "PF_XBTUSD", "side": "long", "size": 0.003525840471367504, "price": 77995.5877848724, "notional": 275.00000000000006, "fee": 0.7150000000000001, "pnl": 0.0, "reason": "squeeze_ride PF_XBTUSD fr=2.0881386504673074 chg=1.05", "equity_after": 49.285, "stop": 76945.62853843445, "take_profit": null, "margin": 27.500000000000004}]}, {"id": "residual_gated", "name": "Residual + gate BTC", "subtitle": "M\u00eame residual, cash si BTC 4h casse", "kind": "livre", "equity": 49.285, "start": 50.0, "pnl": -0.7150000000000034, "pnl_pct": -1.430000000000009, "high_water": 50.0, "max_dd": 1.43, "trades": 0, "fees": 0.7150000000000001, "status": "active", "last_reason": "residual PF_WLDUSD r=6.0 btc=1.1 frac=0.55", "time_to_100": null, "position": {"symbol": "PF_WLDUSD", "side": "long", "size": 660.4778854134795, "entry": 0.41636518962, "mark": 0.41636518962, "leverage": 10, "stop": 0.3944601792256735, "take_profit": null, "margin": 27.500000000000004, "notional": 275.00000000000006}, "log": [{"ts": "2026-08-23T21:19:01Z", "action": "open", "symbol": "PF_WLDUSD", "side": "long", "size": 660.4778854134795, "price": 0.41636518962, "notional": 275.00000000000006, "fee": 0.7150000000000001, "pnl": 0.0, "reason": "residual PF_WLDUSD r=6.0 btc=1.1 frac=0.55", "equity_after": 49.285, "stop": 0.3944601792256735, "take_profit": null, "margin": 27.500000000000004}]}, {"id": "residual_hold", "name": "Residual hold", "subtitle": "24h moins BTC, trail ATR, on ne coupe pas", "kind": "livre", "equity": 49.22, "start": 50.0, "pnl": -0.7800000000000011, "pnl_pct": -1.5600000000000058, "high_water": 50.0, "max_dd": 1.5599999999999998, "trades": 0, "fees": 0.7799999999999999, "status": "active", "last_reason": "residual PF_WLDUSD r=6.0 btc=1.1 frac=0.60", "time_to_100": null, "position": {"symbol": "PF_WLDUSD", "side": "long", "size": 720.5213295419776, "entry": 0.41636518962, "mark": 0.41636518962, "leverage": 10, "stop": 0.3944601792256735, "take_profit": null, "margin": 30.0, "notional": 300.0}, "log": [{"ts": "2026-08-23T21:19:01Z", "action": "open", "symbol": "PF_WLDUSD", "side": "long", "size": 720.5213295419776, "price": 0.41636518962, "notional": 300.0, "fee": 0.7799999999999999, "pnl": 0.0, "reason": "residual PF_WLDUSD r=6.0 btc=1.1 frac=0.60", "equity_after": 49.22, "stop": 0.3944601792256735, "take_profit": null, "margin": 30.0}]}], "passage": [{"date": "2026-08-26", "label": "26 ao\u00fbt J+3", "target": 67}, {"date": "2026-08-30", "label": "30 ao\u00fbt J+7", "target": 100}, {"date": "2026-09-02", "label": "2 sept J+10", "target": 136}, {"date": "2026-09-06", "label": "6 sept J+14", "target": 200}, {"date": "2026-09-13", "label": "13 sept J+21", "target": 405}, {"date": "2026-09-22", "label": "22 sept J+30", "target": 1000}], "note": "T\u00e9moin = vrai paper Kraken. 5 livres recherch\u00e9s = simu prix live, frais 0.26%, pas de slippage. 0$ r\u00e9el."};
const $ = (id) => document.getElementById(id);
const fmt = (n, d=2) => (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString("fr-FR", {minimumFractionDigits:d, maximumFractionDigits:d});
const usd = (n) => fmt(n, 2) + " $";
const pct = (n) => (n>=0?"+":"") + fmt(n,1) + " %";
const cls = (n) => n>=0 ? "up" : "dn";

function posLine(p) {
  if (!p) return '<span class="pill">flat</span>';
  return `<span class="pill ${p.side}">${p.side} ${p.symbol||""}</span>`;
}

function renderHero(t) {
  $("hero").innerHTML = `
    <div class="kicker">Témoin · paper Kraken réel</div>
    <div class="eq ${cls(t.pnl)}">${usd(t.equity)}</div>
    <div class="row">
      <span class="${cls(t.pnl)}">${t.pnl>=0?"+":""}${usd(t.pnl)} vs 50$ (${pct(t.pnl_pct)})</span>
      <span>après lock TRUMP 73$ → ${t.pnl>=22.94?"+":""}${usd(t.equity-72.94)} sur PUMP</span>
      ${posLine(t.position)}
    </div>
    <div class="row" style="margin-top:8px">
      ${t.position ? `entry ${fmt(t.position.entry,5)} · mark ${fmt(t.position.mark,5)} · liq ${fmt(t.position.liq,5)} · TP 0,00564 · SL 0,00488` : "pas de position"}
    </div>`;
  $("hero").onclick = () => openCard(t);
}

function renderSteps(eq) {
  const today = DATA.generated_at.slice(0,10);
  $("steps").innerHTML = DATA.passage.map(s => {
    const past = s.date < today;
    const hit = past && eq >= s.target;
    const miss = past && eq < s.target;
    return `<div class="step ${hit?"hit":miss?"miss":""}">
      <div class="d">${s.label}</div>
      <div class="v">${s.target} $</div>
      <div class="d">${past ? (hit ? "tenu" : "raté") : "à venir"}</div>
    </div>`;
  }).join("");
}

function renderGrid() {
  $("grid").innerHTML = DATA.livres.map(b => `
    <div class="card ${b.position?"":"flat"}" data-id="${b.id}">
      <div class="nm">${b.name}</div>
      <div class="sub">${b.subtitle}</div>
      <div class="eqs ${cls(b.pnl)}">${usd(b.equity)}</div>
      <div class="row"><span class="${cls(b.pnl)}">${pct(b.pnl_pct)}</span> ${posLine(b.position)}</div>
    </div>`).join("");
  $("grid").querySelectorAll(".card").forEach(el => {
    el.onclick = () => openCard(DATA.livres.find(x => x.id===el.dataset.id));
  });
}

function openCard(b) {
  const p = b.position;
  let body = `<button class="close" onclick="document.getElementById('panel').classList.remove('open')">fermer</button>
    <div class="kicker">${b.kind==="temoin"?"TÉMOIN":"LIVRE"}</div>
    <h3>${b.name}</h3>
    <p class="meta">${b.subtitle||""}</p>
    <div class="eq ${cls(b.pnl)}">${usd(b.equity)}</div>
    <p class="${cls(b.pnl)}">${pct(b.pnl_pct)} · max DD ${b.max_dd!=null?fmt(b.max_dd,1)+"%":"—"} · trades ${b.trades??"—"}</p>
    <table>
      <tr><th>Départ</th><td>${usd(b.start)}</td></tr>
      ${b.lock_trump?`<tr><th>Après lock TRUMP</th><td>${usd(b.lock_trump)}</td></tr>`:""}
      ${b.high_water?`<tr><th>Plus haut</th><td>${usd(b.high_water)}</td></tr>`:""}
      ${p?`<tr><th>Position</th><td>${p.side} ${p.symbol} × ${fmt(p.size, p.size>10?0:4)}</td></tr>
      <tr><th>Entry / mark</th><td>${fmt(p.entry, p.entry<1?5:4)} / ${fmt(p.mark, p.mark<1?5:4)}</td></tr>
      <tr><th>Stop / TP</th><td>${p.stop??"—"} / ${p.take_profit??"—"}</td></tr>
      ${p.liq?`<tr><th>Liquidation</th><td>${fmt(p.liq,5)}</td></tr>`:""}
      ${p.notional?`<tr><th>Notional / marge</th><td>${usd(p.notional)} / ${usd(p.margin)}</td></tr>`:""}`:`<tr><th>Position</th><td>flat</td></tr>`}
    </table>`;
  if (b.story) {
    body += `<ul class="story">${b.story.map(s=>`<li><em>${s.t}</em>${s.e}</li>`).join("")}</ul>`;
  }
  if (b.log && b.log.length) {
    body += `<table><tr><th>Quand</th><th></th><th>Action</th></tr>` +
      b.log.slice().reverse().map(x=>`<tr><td>${(x.ts||"").replace("T"," ").slice(0,16)}</td><td></td><td>${x.action} ${x.side||""} ${x.symbol||""}</td></tr>`).join("") + `</table>`;
  }
  if (b.last_reason) body += `<p class="legend">${b.last_reason}</p>`;
  $("sheet").innerHTML = body;
  $("panel").classList.add("open");
}
$("panel").onclick = (e) => { if (e.target.id==="panel") $("panel").classList.remove("open"); };

function paint(D) {
  window.DATA = D;
  $("meta").textContent = "MAJ " + (D.generated_at||"").replace("T"," ").slice(0,19) + " · " + (D.ticks||0) + " ticks bake-off";
  renderHero(D.temoin);
  renderSteps(D.temoin.equity);
  renderGrid();
}
async function boot() {
  let D = DATA;
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if (r.ok) D = await r.json();
  } catch (e) {}
  paint(D);
}
boot();
setInterval(boot, 20000);
</script>
</body>
</html>
